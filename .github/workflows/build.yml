name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Descompacta o arquivo zip
      - name: Extract project zip
        run: |
          unzip -o "*.zip"

      # 2. Configura o Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Gera a estrutura de arquivos nativos do Android
      - name: Recreate Android native files
        working-directory: ./inventario_app
        run: flutter create --platforms=android .

      # 5. Injeta as permissões de câmera no AndroidManifest
      - name: Configure Android Permissions
        working-directory: ./inventario_app/android/app/src/main
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA"/>' AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-feature android:name="android.hardware.camera" android:required="false"/>' AndroidManifest.xml

      # 6. Instala as dependências do pubspec.yaml
      - name: Get dependencies
        working-directory: ./inventario_app
        run: flutter pub get

      # 7. Compila o APK em modo release injetando as versões de SDK no Gradle
      - name: Build APK
        working-directory: ./inventario_app
        run: |
          flutter build apk --release --extra-front-end-options=--no-implicit-casts \
            --build-property=android.compileSdkVersion=34 \
            --build-property=android.targetSdkVersion=34 \
            --build-property=android.minSdkVersion=21

      # 8. Disponibiliza o APK para download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: inventario_app/build/app/outputs/flutter-apk/app-release.apk
