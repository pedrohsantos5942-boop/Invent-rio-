name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Descompacta o arquivo zip
      - name: Extract project zip
        run: |
          unzip -o "*.zip"

      # 2. Configura o Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Gera a estrutura de arquivos nativos do Android
      - name: Recreate Android native files
        working-directory: ./inventario_app
        run: flutter create --platforms=android .

      # 5. Força SDK 34 e minSdkVersion 21 globalmente em todas as dependências
      - name: Force Android SDK 34 & Permissions
        run: |
          MANIFEST_PATH="inventario_app/android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA"/>' $MANIFEST_PATH
          sed -i '/<manifest/a \    <uses-feature android:name="android.hardware.camera" android:required="false"/>' $MANIFEST_PATH

          APP_GRADLE="inventario_app/android/app/build.gradle"
          ROOT_GRADLE="inventario_app/android/build.gradle"

          # Substitui declarações diretas de versão no gradle do app
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' $APP_GRADLE
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/' $APP_GRADLE
          sed -i 's/minSdkVersion.*/minSdkVersion 21/' $APP_GRADLE

          # Força a sobreescrição das versões para TODOS os subprojetos e dependências (como mobile_scanner)
          cat << 'EOF' >> inventario_app/android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          defaultConfig {
                              targetSdkVersion 34
                              minSdkVersion 21
                          }
                      }
                  }
              }
          }
          EOF

      # 6. Instala as dependências do pubspec.yaml
      - name: Get dependencies
        working-directory: ./inventario_app
        run: flutter pub get

      # 7. Compila o APK em modo release
      - name: Build APK
        working-directory: ./inventario_app
        run: flutter build apk --release

      # 8. Disponibiliza o APK para download no GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: inventario_app/build/app/outputs/flutter-apk/app-release.apk
