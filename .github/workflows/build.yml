name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Descompacta o arquivo zip
      - name: Extract project zip
        run: |
          unzip -o "*.zip" || true

      # 2. Configura o Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Atualiza o Gradle Wrapper para a versão 8.14
      - name: Upgrade Gradle Version
        working-directory: ./inventario_app/android
        run: |
          sed -i 's/gradle-8.10.2-bin.zip/gradle-8.14-bin.zip/g' gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-8.10.2-all.zip/gradle-8.14-bin.zip/g' gradle/wrapper/gradle-wrapper.properties || true

      # 5. Adiciona regra no ProGuard para ignorar os avisos de classes ausentes do Play Core no R8
      - name: Configure ProGuard / R8 rules
        working-directory: ./inventario_app/android/app
        run: |
          echo "-dontwarn com.google.android.play.core.**" >> proguard-rules.pro
          echo "-dontwarn io.flutter.embedding.engine.deferredcomponents.**" >> proguard-rules.pro
          echo "-keep class com.google.android.play.core.** { *; }" >> proguard-rules.pro

      # 6. Instala as dependências
      - name: Get dependencies
        working-directory: ./inventario_app
        run: flutter pub get

      # 7. Compila o APK em modo release sem minificação de código
      - name: Build APK
        working-directory: ./inventario_app
        run: flutter build apk --release --no-shrink --android-skip-build-dependency-validation

      # 8. Disponibiliza o APK para download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: inventario_app/build/app/outputs/flutter-apk/app-release.apk
