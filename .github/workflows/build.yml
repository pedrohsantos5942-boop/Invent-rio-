name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Descompacta o arquivo zip enviado no repositório
      - name: Extract project zip
        run: unzip inventario_app.zip

      # 2. Configura o Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Baixa as dependências
      - name: Get dependencies
        working-directory: ./inventario_app
        run: flutter pub get

      # 5. Compila o APK
      - name: Build APK
        working-directory: ./inventario_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: inventario_app/build/app/outputs/flutter-apk/app-release.apk
