name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Descompacta o arquivo zip
      - name: Extract project zip
        run: |
          unzip -o "*.zip"

      # 2. Configura o Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Gera a estrutura de arquivos nativos do Android
      - name: Recreate Android native files
        working-directory: ./inventario_app
        run: flutter create --platforms=android .

      # 5. Injeta permissões no AndroidManifest
      - name: Configure Android Permissions
        working-directory: ./inventario_app/android/app/src/main
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA"/>' AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-feature android:name="android.hardware.camera" android:required="false"/>' AndroidManifest.xml

      # 6. Força SDK 34 e minSdkVersion 21 em todas as dependências nativas
      - name: Force Android SDK Versions
        working-directory: ./inventario_app/android
        run: |
          cat << 'EOF' >> settings.gradle
          
          gradle.beforeProject { project ->
              project.plugins.withId('com.android.application') {
                  project.android {
                      compileSdkVersion 34
                      defaultConfig {
                          targetSdkVersion 34
                          minSdkVersion 21
                      }
                  }
              }
              project.plugins.withId('com.android.library') {
                  project.android {
                      compileSdkVersion 34
                      defaultConfig {
                          minSdkVersion 21
                      }
                  }
              }
          }
          EOF

      # 7. Instala as dependências do pubspec.yaml
      - name: Get dependencies
        working-directory: ./inventario_app
        run: flutter pub get

      # 8. Compila o APK em modo release
      - name: Build APK
        working-directory: ./inventario_app
        run: flutter build apk --release

      # 9. Disponibiliza o APK para download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: inventario_app/build/app/outputs/flutter-apk/app-release.apk
