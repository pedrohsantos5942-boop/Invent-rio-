name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Descompacta o novo arquivo zip enviado
      - name: Extract project zip
        run: |
          unzip -o "inventario_app (2).zip" || unzip -o "inventario_app (1).zip" || unzip -o inventario_app.zip

      # 2. Configura o Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Gera a estrutura de arquivos nativos do Android
      - name: Recreate Android native files
        working-directory: ./inventario_app
        run: flutter create --platforms=android .

      # 5. Injeta a permissão de CÂMERA no AndroidManifest.xml
      - name: Add Camera Permission
        run: |
          MANIFEST_PATH="inventario_app/android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA"/>' $MANIFEST_PATH

      # 6. Instala as dependências do pubspec.yaml (mobile_scanner, provider, etc)
      - name: Get dependencies
        working-directory: ./inventario_app
        run: flutter pub get

      # 7. Compila o arquivo APK final
      - name: Build APK
        working-directory: ./inventario_app
        run: flutter build apk --release

      # 8. Disponibiliza o APK para download no GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: inventario_app/build/app/outputs/flutter-apk/app-release.apk
