name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Descompacta o arquivo zip (se seu projeto estiver compactado no repo)
      - name: Extract project zip
        run: |
          unzip -o "*.zip" || true

      # 2. Configura o Java 17 (Obrigatório para o AGP 8.x e SDK 35)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Baixa os pacotes do pubspec.yaml
      - name: Get dependencies
        working-directory: ./inventario_app
        run: flutter pub get

      # 5. Compila o APK em modo release usando as configurações nativas corrigidas
      - name: Build APK
        working-directory: ./inventario_app
        run: flutter build apk --release

      # 6. Disponibiliza o APK para download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: inventario_app/build/app/outputs/flutter-apk/app-release.apk
