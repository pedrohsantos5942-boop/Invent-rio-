name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Descompacta o arquivo zip
      - name: Extract project zip
        run: |
          unzip -o "*.zip"

      # 2. Configura o Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura o Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Gera a estrutura de arquivos nativos do Android
      - name: Recreate Android native files
        working-directory: ./inventario_app
        run: flutter create --platforms=android .

      # 5. Injeta permissões e eleva compileSdkVersion / targetSdkVersion para 34 e minSdkVersion para 21
      - name: Configure Android Permissions & SDK Versions
        run: |
          MANIFEST_PATH="inventario_app/android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA"/>' $MANIFEST_PATH
          sed -i '/<manifest/a \    <uses-feature android:name="android.hardware.camera" android:required="false"/>' $MANIFEST_PATH
          
          GRADLE_PATH="inventario_app/android/app/build.gradle"
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' $GRADLE_PATH || true
          sed -i 's/flutter.minSdkVersion/21/' $GRADLE_PATH || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' $GRADLE_PATH || true
          sed -i 's/flutter.compileSdkVersion/34/' $GRADLE_PATH || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' $GRADLE_PATH || true
          sed -i 's/flutter.targetSdkVersion/34/' $GRADLE_PATH || true

      # 6. Instala as dependências do pubspec.yaml
      - name: Get dependencies
        working-directory: ./inventario_app
        run: flutter pub get

      # 7. Compila o APK em modo release
      - name: Build APK
        working-directory: ./inventario_app
        run: flutter build apk --release

      # 8. Disponibiliza o APK para download no GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: inventario_app/build/app/outputs/flutter-apk/app-release.apk
